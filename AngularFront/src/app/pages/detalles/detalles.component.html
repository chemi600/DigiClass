 <div class="container">
        <div class="course-section">
            <h1>{{Curso.titulo}}</h1>
            
            <p>{{Curso.descripcion}}</p>
            <div class="duration"><i class="fa-solid fa-calendar-days"></i> {{fechaInicio}} - {{fechaFin}}</div>
            <ng-container *ngIf="role=='estudiante'">
            <div class="button-section">
                <button>Inscribirse</button>
            </div>
            </ng-container>
        </div>
        <div class="instructor-section">
            <img src="https://i0.wp.com/digitalhealthskills.com/wp-content/uploads/2022/11/3da39-no-user-image-icon-27.png?fit=500%2C500&ssl=1" alt="Instructor">
            <h3>{{Curso.nombreProfesor}}</h3>
            <p>Profesor</p>
        </div>
    </div>
<ng-container *ngIf="role=='profesor'">
  <div class="tabs-section">
        <div class="tabs">
            <div class="tab active">ESTUDIANTES</div>
        </div>
        <div class="tab-content">
            <table>
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Correo</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                      <tr *ngFor="let user of participantes">
                      <td>{{user.name}}</td>
                      <td>{{user.email}}</td>
                      <td>
                        <button (click)="deleteUser(user.name,user.id)">Eliminar</button>
                      </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</ng-container>
