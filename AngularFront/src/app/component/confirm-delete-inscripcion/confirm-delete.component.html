<h2 mat-dialog-title>Confirmar eliminación</h2>
<mat-dialog-content>
  ¿Estás seguro que deseas abandonar el curso?
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button (click)="onCancel()">Cancelar</button>
  <button mat-button color="warn" (click)="onConfirm()">Eliminar</button>
</mat-dialog-actions>
